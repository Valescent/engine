[package]
name = "engine"
version = "0.0.7"
default-run = "engine"
edition = "2024"
rust-version = "1.99.1"
description = "A voxel engine written in Rust."
repository = "https://github.com/Valescent/engine"
license-file = "LICENSE"
publish = false

[workspace]
members = [".", "crates/terrain-core"]
default-members = [".", "crates/terrain-core"]
resolver = "3"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.34"
micropool = "0.4.2"
pollster = "1"
profiling = { version = "=1.0.18", default-features = false }
rayon = { version = "1.12.0", optional = true }
thiserror = "2"
tracy-client = { version = "=0.18.4", optional = true, default-features = false, features = ["enable", "ondemand", "only-localhost"] }
tracy-client-sys = { version = "=0.28.0", optional = true, default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
terrain-core = { version = "0.0.7", path = "crates/terrain-core" }
wgpu = "30"
wgpu-profiler = { version = "=0.28.0", optional = true, features = ["tracy"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
fastnoise-lite = "1.1.1"

[features]
default = ["tracy"]
tracy = [
    "profiling/profile-with-tracy",
    "dep:tracy-client",
    "dep:tracy-client-sys",
    "dep:wgpu-profiler",
]
rayon-pool = ["dep:rayon"]

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[dev-dependencies]
rayon = "1.12.0"

[[bench]]
name = "pool_sim"
harness = false
