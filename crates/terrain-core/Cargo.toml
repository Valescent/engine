[package]
name = "terrain-core"
version = "0.0.7"
edition = "2024"
rust-version = "1.99.1"
description = "Headless terrain generation, storage, lighting, and meshing for the Valescent engine."
repository = "https://github.com/Valescent/engine"
publish = false

[lib]
name = "terrain_core"
path = "src/lib.rs"

[[bin]]
name = "terrain-gen"
path = "src/terrain_gen.rs"

[dependencies]
fastnoise-lite = "1.1.1"
thiserror = "2"

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
