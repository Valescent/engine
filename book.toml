[book]
title = "Valescent Engine"
authors = ["Valescent"]
description = "Documentation for Valescent Engine, a voxel engine written in Rust."
language = "en"
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
site-url = "/engine/"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/custom.css"]
git-repository-url = "https://github.com/Valescent/engine"
edit-url-template = "https://github.com/Valescent/engine/edit/main/{path}"
