# cargo-deny: licences, security advisories, duplicate crates, and sources.
# Run locally with `cargo deny check` after `cargo install cargo-deny --locked`.

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # egui's default fonts: Ubuntu Font Licence 1.0 and SIL OFL 1.1.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[licenses.private]
# This crate is published nowhere and carries a PolyForm Shield licence file,
# which is not an SPDX identifier. Do not try to match it against the allow list.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
