name: Perf

on:
  push:
    branches: [main]
    # A docs-only push does not change runtime behaviour; skip the release
    # build and headless runs until the next code push or nightly schedule.
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/**'
      - 'tests/**'
      - 'benches/**'
      - '.cargo/**'
      - '.github/workflows/perf.yml'
  # Nightly, not per-PR. The blend calibration is a measurement with thin
  # margins (pair 2-3 has 36 transects and p90 63.32 against a 64-block
  # ceiling), so a small platform-level float difference could fail an
  # otherwise correct pull request. Running it once a night on one known
  # Linux runner keeps the signal without making every PR pay for it.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  headless:
    name: Headless run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --no-default-features

      - name: Static camera at distance 12
        env:
          ENGINE_HEADLESS: "1"
          ENGINE_HEADLESS_FRAMES: "600"
          ENGINE_HEADLESS_SPEED: "0"
          ENGINE_SEED: "42"
          RUST_LOG: "warn"
        run: |
          target/release/engine | tee headless-static.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '^HEADLESS ' headless-static.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Walk at 32 m/s
        env:
          ENGINE_HEADLESS: "1"
          ENGINE_HEADLESS_FRAMES: "600"
          ENGINE_HEADLESS_SPEED: "32"
          ENGINE_SEED: "42"
          RUST_LOG: "warn"
        run: |
          target/release/engine | tee headless-walk.txt
          grep '^HEADLESS ' headless-walk.txt >> "$GITHUB_STEP_SUMMARY"

      # Generous budgets: GitHub runners are shared and slower than the reference
      # machine. These catch order-of-magnitude regressions, not small drift.
      - name: Budgets
        run: |
          line=$(grep '^HEADLESS ' headless-static.txt)
          value() { echo "$line" | tr ' ' '\n' | grep "^$1=" | cut -d= -f2; }

          ready=$(value ready_columns)
          mean=$(value mean_ms)
          p95=$(value p95_ms)
          resident=$(value resident_bytes)

          echo "ready_columns=$ready mean_ms=$mean p95_ms=$p95 resident_bytes=$resident"
          test "$ready" = "625" || { echo "expected 625 ready columns at distance 12"; exit 1; }
          awk -v mean="$mean" 'BEGIN { exit !(mean < 20.0) }' || { echo "mean frame work above 20 ms"; exit 1; }
          awk -v p95="$p95" 'BEGIN { exit !(p95 < 50.0) }' || { echo "p95 frame work above 50 ms"; exit 1; }
          test "$resident" -lt 200000000 || { echo "resident world data above 200 MB"; exit 1; }

      # Not part of the PR `Terrain gates` job. The 16-seed medians sit close
      # to the 20..=28-block window and pair 2-3's p90 is 63.32 against the
      # 64-block ceiling, so platform float drift could flip a pull request
      # that did not change the blend. The per-PR coverage floors are covered
      # by `biome_coverage_holds_for_pr_seeds`; this measurement runs nightly
      # here, where a failure is a data signal rather than PR noise.
      - name: Biome blend calibration
        run: |
          set -o pipefail
          cargo run --release --locked --quiet --no-default-features --bin terrain-gen -- \
            calibrate-blend --seeds 16 | tee blend-calibration.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat blend-calibration.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: headless-results
          path: |
            headless-static.txt
            headless-walk.txt
            blend-calibration.txt
