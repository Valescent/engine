---
name: Bug report
description: Something renders wrong, crashes, or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. This is a pre-alpha engine, so a reproduction matters more than a tidy description.

        Do not report security vulnerabilities here — see [SECURITY.md](https://github.com/Valescent/engine/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The behaviour you observed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cargo run
        2. ...
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse HEAD`.
    validations:
      required: true

  - type: input
    id: rust
    attributes:
      label: Rust version
      description: Output of `rustc --version`.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS, GPU, and driver
      placeholder: Windows 11, RTX 4070, 566.36
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste backtraces, validation errors, or images here.
      render: text
    validations:
      required: false
